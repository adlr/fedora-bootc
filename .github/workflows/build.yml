name: Build Fedora 45 bootc image

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  push:
    branches: [main]
    paths:
      - Containerfile
      - files/**
      - .github/workflows/build.yml
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fedora-bootc
  FEDORA_VERSION: "45"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        run: |
          IMAGE="${IMAGE_NAME,,}"
          DATE=$(date -u +%Y%m%d)
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:latest ${IMAGE}:${FEDORA_VERSION} ${IMAGE}:${FEDORA_VERSION}-${DATE}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          tag_args=()
          for t in ${{ steps.meta.outputs.tags }}; do tag_args+=(--tag "$t"); done
          podman build --pull=newer \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label containers.bootc=1 \
            "${tag_args[@]}" -f Containerfile .

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for t in ${{ steps.meta.outputs.tags }}; do podman push "$t"; done
