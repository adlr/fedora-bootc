# If the system suspends while the lock screen has a fingerprint scan
# running, fprintd can't close the Goodix reader ("The device is still
# busy") and the lock screen gets no fingerprint prompt after resume.
# Stop fprintd before every sleep; it's D-Bus activated, so the lock
# screen starts a fresh one on resume.
[Unit]
Conflicts=sleep.target
Before=sleep.target
